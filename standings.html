<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리그 순위 및 기록실 | KFL</title>
  <meta name="description" content="KFL 리그 순위표, 최근 5경기 전적, 득점 및 도움 순위">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f5f6fa">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/kis-watermark.png">
  <link rel="apple-touch-icon" href="assets/kis-watermark.png">

  <!-- Open Graph / URL Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="리그 순위 및 기록실 | KFL">
  <meta property="og:description" content="KFL 리그 순위표, 최근 5경기 전적, 득점 및 도움 순위">
  <meta property="og:image" content="https://baeseojin145.github.io/KIS-Football-League/assets/kis-watermark.png">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="리그 순위 및 기록실 | KFL">
  <meta name="twitter:description" content="KFL 리그 순위표, 최근 5경기 전적, 득점 및 도움 순위">
  <meta name="twitter:image" content="https://baeseojin145.github.io/KIS-Football-League/assets/kis-watermark.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <!-- Header / Nav -->
  <div id="app-nav"></div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <!-- Page Header -->
      <section style="margin-bottom: var(--spacing-lg);">
        <div>
          <h1 style="font-size: var(--text-2xl); font-weight: 800; margin: 0;">리그 순위 및 기록실</h1>
          <p style="font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px;">순위표 및 개인 기록</p>
        </div>
      </section>

      <!-- League Standings Table Card -->
      <div class="card mb-xl" style="overflow-x: auto;">
        <table class="table" style="min-width: 600px;">
          <thead>
            <tr>
              <th style="width: 36px; text-align: center;">순위</th>
              <th>구단</th>
              <th style="text-align: center; width: 44px;">경기</th>
              <th style="text-align: center; width: 44px;">승</th>
              <th style="text-align: center; width: 44px;">무</th>
              <th style="text-align: center; width: 44px;">패</th>
              <th style="text-align: center; width: 44px;">득점</th>
              <th style="text-align: center; width: 44px;">실점</th>
              <th style="text-align: center; width: 50px;">득실</th>
              <th style="text-align: center; width: 54px;">승점</th>
              <th class="hide-on-mobile" style="text-align: center; width: 120px;">최근 5경기</th>
            </tr>
          </thead>
          <tbody id="standings-table-body"></tbody>
        </table>
      </div>

      <!-- Leaders Section (Goals & Assists) -->
      <section class="mb-xl">
        <h2 style="font-size: var(--text-lg); font-weight: 700; margin-bottom: var(--spacing-md);">
          개인 기록 순위
        </h2>

        <div class="grid grid-2">
          
          <!-- Top Scorers -->
          <div class="card">
            <div class="flex justify-between items-center mb-md">
              <h3 style="margin: 0; font-size: var(--text-base); font-weight: 700;">득점 순위</h3>
              <span class="badge badge-primary">TOP 5</span>
            </div>
            <div id="individual-top-scorers"></div>
          </div>

          <!-- Top Assists -->
          <div class="card">
            <div class="flex justify-between items-center mb-md">
              <h3 style="margin: 0; font-size: var(--text-base); font-weight: 700;">도움 순위</h3>
              <span class="badge badge-neutral">TOP 5</span>
            </div>
            <div id="individual-top-assists"></div>
          </div>

        </div>
      </section>

    </div>
  </main>

  <!-- Footer -->
  <div id="app-footer"></div>

  <!-- Mobile Bottom Nav -->
  <div id="app-bottom-nav"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/standings.js"></script>
</body>
</html>
