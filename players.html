<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선수 명단 | KFL</title>
  <meta name="description" content="KFL 구단별 선수 명단 및 프로필">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f5f6fa">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <!-- Header / Nav -->
  <div id="app-nav"></div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <!-- Page Header -->
      <section style="margin-bottom: var(--spacing-lg);">
        <div class="flex justify-between items-center" style="flex-wrap: wrap; gap: var(--spacing-sm);">
          <div>
            <h1 style="font-size: var(--text-2xl); font-weight: 800; margin: 0;">선수 명단</h1>
            <p style="font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px;">구단 및 포지션별 선수 정보</p>
          </div>
          <div id="players-count-badge" class="badge badge-neutral">불러오는 중...</div>
        </div>
      </section>

      <!-- Filter Controls Bar -->
      <div class="card mb-lg">
        <!-- Team Chips -->
        <div class="mb-md">
          <div style="font-size: var(--text-xs); color: var(--text-muted); font-weight: 600; margin-bottom: 4px;">구단 선택:</div>
          <div id="team-pills-container" class="flex gap-xs" style="flex-wrap: wrap;"></div>
        </div>

        <!-- Position & Search Row -->
        <div class="flex justify-between items-center" style="flex-wrap: wrap; gap: var(--spacing-sm); border-top: 1px solid var(--border-color); padding-top: var(--spacing-sm);">
          <div class="flex gap-xs items-center" style="flex-wrap: wrap;">
            <span style="font-size: var(--text-xs); color: var(--text-muted); margin-right: 4px;">포지션:</span>
            <button class="chip position-filter-chip active" data-pos="all">전체</button>
            <button class="chip position-filter-chip" data-pos="FW">FW</button>
            <button class="chip position-filter-chip" data-pos="MF">MF</button>
            <button class="chip position-filter-chip" data-pos="DF">DF</button>
            <button class="chip position-filter-chip" data-pos="GK">GK</button>
          </div>

          <div style="max-width: 220px; width: 100%;">
            <input type="text" id="player-search-input" placeholder="선수 이름 또는 번호 검색..." style="padding: 6px 12px; font-size: var(--text-xs);">
          </div>
        </div>
      </div>

      <!-- Players Grid -->
      <div class="grid grid-3" id="players-grid-container"></div>

    </div>
  </main>

  <!-- Footer -->
  <div id="app-footer"></div>

  <!-- Mobile Bottom Nav -->
  <div id="app-bottom-nav"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/players.js"></script>
</body>
</html>
